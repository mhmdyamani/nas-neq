crons:
  - name: daily-order-summary
    description: "Emails the owner last night's orders, sales and low-stock items at 12:30am Manila time"
    cron: "30 0 * * *"
    timezone: "Asia/Manila"
    endpoint: "{{BASE_URL}}/api/cron/daily-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
